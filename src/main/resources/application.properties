spring.application.name=sistema-alianca

# Carrega configuracoes locais, quando existir um arquivo .env na raiz.
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sistema_alianca}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Obrigatorio: nao existe chave JWT padrao no codigo.
jwt.secret=${JWT_SECRET}
